<svg id="battleship-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" class="w-full h-full">
                    <defs>
                        <linearGradient id="int-hull" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#701a75"></stop>
                            <stop offset="50%" stop-color="#4a044e"></stop>
                            <stop offset="100%" stop-color="#120016"></stop>
                        </linearGradient>
                        <linearGradient id="int-energy" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#f0abfc"></stop>
                            <stop offset="50%" stop-color="#e879f9"></stop>
                            <stop offset="100%" stop-color="#c084fc"></stop>
                        </linearGradient>
                        <filter id="glow-fuchsia" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="6" result="blur"></feGaussianBlur>
                            <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
                        </filter>
                    </defs>

                    <!-- Energy Ring Exhaust -->
                    <g class="layer-cores" style="display: block;">
                        <ellipse cx="220" cy="325" rx="30" ry="80" fill="none" stroke="url(#int-energy)" stroke-width="6" filter="url(#glow-fuchsia)" data-filter="url(#glow-fuchsia)"></ellipse>
                    </g>

                    <!-- Organic Curved Frame -->
                    <g class="layer-gantries" stroke="#c084fc" stroke-width="1.2" fill="none" style="display: block;">
                        <path d="M 220 245 C 450 150, 750 180, 1020 325 C 750 470, 450 500, 220 405" stroke-dasharray="5 3"></path>
                    </g>

                    <!-- Asymmetrical Curved Bio Hull -->
                    <g class="layer-base" stroke="#a21caf" stroke-width="2">
                        <path d="M 220 260 C 380 180, 680 160, 1020 325 C 680 490, 380 470, 220 390 C 300 350, 420 330, 550 325 C 420 320, 300 300, 220 260 Z" fill="url(#int-hull)"></path>
                    </g>

                    <!-- Paneling Overlays -->
                    <g class="layer-panels" fill="#581c87" stroke="#f0abfc" stroke-width="1" style="display: block;">
                        <path d="M 380 270 Q 580 220 780 290 Q 580 310 380 270 Z"></path>
                        <path d="M 380 380 Q 580 430 780 360 Q 580 340 380 380 Z"></path>
                    </g>

                    <!-- Siphon Core & Plasma Nodes -->
                    <g class="layer-cores" style="display: block;">
                        <circle cx="550" cy="325" r="28" fill="url(#int-energy)" filter="url(#glow-fuchsia)" data-filter="url(#glow-fuchsia)"></circle>
                        <path d="M 220 325 L 1020 325" stroke="#f472b6" stroke-width="2" filter="url(#glow-fuchsia)" data-filter="url(#glow-fuchsia)"></path>
                    </g>

                    <!-- Optics & Arc Emitters -->
                    <g class="layer-accents" stroke="#fbcfe8" stroke-width="1.5" style="display: block;">
                        <line x1="1020" y1="325" x2="1080" y2="325" stroke="#e879f9" stroke-width="3" filter="url(#glow-fuchsia)" data-filter="url(#glow-fuchsia)"></line>
                        <circle cx="780" cy="290" r="4" fill="#fbcfe8" filter="url(#glow-fuchsia)" data-filter="url(#glow-fuchsia)"></circle>
                        <circle cx="780" cy="360" r="4" fill="#fbcfe8" filter="url(#glow-fuchsia)" data-filter="url(#glow-fuchsia)"></circle>
                    </g>
                </svg>