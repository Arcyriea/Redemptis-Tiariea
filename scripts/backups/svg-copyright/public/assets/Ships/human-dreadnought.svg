<svg id="battleship-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" class="w-full h-full">
                    <defs>
                        <!-- Armor Gradients -->
                        <linearGradient id="hum-plate-dark" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#1e293b"></stop>
                            <stop offset="50%" stop-color="#0f172a"></stop>
                            <stop offset="100%" stop-color="#020617"></stop>
                        </linearGradient>
                        <linearGradient id="hum-plate-mid" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#475569"></stop>
                            <stop offset="50%" stop-color="#334155"></stop>
                            <stop offset="100%" stop-color="#1e293b"></stop>
                        </linearGradient>
                        <linearGradient id="hum-plate-light" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#64748b"></stop>
                            <stop offset="100%" stop-color="#334155"></stop>
                        </linearGradient>
                        <linearGradient id="hum-engine-glow" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#00f0ff"></stop>
                            <stop offset="40%" stop-color="#0088ff"></stop>
                            <stop offset="100%" stop-color="#001133" stop-opacity="0"></stop>
                        </linearGradient>
                        <linearGradient id="hum-laser" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#38bdf8"></stop>
                            <stop offset="100%" stop-color="#0284c7"></stop>
                        </linearGradient>

                        <!-- Glow Effect -->
                        <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="6" result="blur"></feGaussianBlur>
                            <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
                        </filter>
                    </defs>

                    <!-- Thruster Exhaust Plumes -->
                    <g class="layer-cores" style="display: block;">
                        <!-- Main Drives -->
                        <polygon points="120,240 -20,220 120,270" fill="url(#hum-engine-glow)" filter="url(#glow-cyan)" data-filter="url(#glow-cyan)"></polygon>
                        <polygon points="120,285 -60,260 120,325" fill="url(#hum-engine-glow)" filter="url(#glow-cyan)" data-filter="url(#glow-cyan)"></polygon>
                        <polygon points="120,335 -60,390 120,365" fill="url(#hum-engine-glow)" filter="url(#glow-cyan)" data-filter="url(#glow-cyan)"></polygon>
                        <polygon points="120,380 -20,430 120,410" fill="url(#hum-engine-glow)" filter="url(#glow-cyan)" data-filter="url(#glow-cyan)"></polygon>
                    </g>

                    <!-- Structural Framework & Skeleton -->
                    <g class="layer-gantries" stroke="#334155" stroke-width="1.5" fill="none" style="display: block;">
                        <!-- Exposed Truss Structures -->
                        <pattern id="truss-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
                            <line x1="0" y1="0" x2="20" y2="20" stroke="#475569" stroke-width="1"></line>
                            <line x1="20" y1="0" x2="0" y2="20" stroke="#475569" stroke-width="1"></line>
                        </pattern>
                        <rect x="220" y="270" width="300" height="110" fill="url(#truss-pattern)" opacity="0.4"></rect>
                        <path d="M 200 220 L 550 220 M 200 430 L 550 430" stroke="#0284c7" stroke-width="2" stroke-dasharray="8 4"></path>
                    </g>

                    <!-- Main Hull & Layered Armor Plates -->
                    <g class="layer-base" stroke="#0f172a" stroke-width="2" stroke-linejoin="round">
                        <!-- Primary Keel Structure -->
                        <path d="M 120 220 L 280 160 L 650 140 L 850 210 L 1120 315 L 1120 335 L 850 440 L 650 510 L 280 490 L 120 430 Z" fill="url(#hum-plate-dark)"></path>
                        
                        <!-- Mid Armor Ridge -->
                        <path d="M 180 240 L 320 190 L 620 180 L 820 250 L 1040 320 L 1040 330 L 820 400 L 620 470 L 320 460 L 180 410 Z" fill="url(#hum-plate-mid)"></path>
                        
                        <!-- Front Reinforced Wedge Prow -->
                        <path d="M 650 240 L 880 260 L 1080 322 L 1080 328 L 880 390 L 650 410 Z" fill="url(#hum-plate-light)"></path>
                    </g>

                    <!-- Overlapping Armor Tiles & Panel Detailing -->
                    <g class="layer-panels" stroke="#0284c7" stroke-width="0.8" fill="url(#hum-plate-mid)" style="display: block;">
                        <!-- Upper Armor Flaps -->
                        <polygon points="340,195 480,185 520,230 380,240"></polygon>
                        <polygon points="500,183 640,175 670,225 530,230"></polygon>
                        <!-- Lower Armor Flaps -->
                        <polygon points="340,455 480,465 520,420 380,410"></polygon>
                        <polygon points="500,467 640,475 670,425 530,420"></polygon>
                        
                        <!-- Modular Hull Panels -->
                        <path d="M 700 270 L 820 280 L 800 320 L 680 310 Z" fill="#1e293b"></path>
                        <path d="M 700 380 L 820 370 L 800 330 L 680 340 Z" fill="#1e293b"></path>
                    </g>

                    <!-- Thruster Assemblies & Power Core -->
                    <g class="layer-cores" style="display: block;">
                        <!-- Main Engine Nozzles -->
                        <rect x="110" y="225" width="25" height="40" rx="3" fill="#334155" stroke="#64748b"></rect>
                        <rect x="110" y="280" width="30" height="45" rx="3" fill="#1e293b" stroke="#38bdf8"></rect>
                        <rect x="110" y="330" width="30" height="45" rx="3" fill="#1e293b" stroke="#38bdf8"></rect>
                        <rect x="110" y="385" width="25" height="40" rx="3" fill="#334155" stroke="#64748b"></rect>

                        <!-- Central Plasma Reactor Window -->
                        <ellipse cx="480" cy="325" rx="35" ry="12" fill="#00f0ff" filter="url(#glow-cyan)" data-filter="url(#glow-cyan)"></ellipse>
                        <path d="M 440 325 L 520 325" stroke="#ffffff" stroke-width="2"></path>
                    </g>

                    <!-- Turrets, Hardpoints & Sensory Masts -->
                    <g class="layer-accents" stroke="#38bdf8" stroke-width="1.5" style="display: block;">
                        <!-- Heavy Railgun Turrets (Top Spine) -->
                        <g transform="translate(420, 180)">
                            <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#38bdf8"></circle>
                            <line x1="0" y1="-3" x2="35" y2="-3" stroke="#38bdf8" stroke-width="3"></line>
                            <line x1="0" y1="3" x2="35" y2="3" stroke="#38bdf8" stroke-width="3"></line>
                        </g>
                        <g transform="translate(580, 172)">
                            <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#38bdf8"></circle>
                            <line x1="0" y1="-3" x2="35" y2="-3" stroke="#38bdf8" stroke-width="3"></line>
                            <line x1="0" y1="3" x2="35" y2="3" stroke="#38bdf8" stroke-width="3"></line>
                        </g>

                        <!-- Torpedo Launch Array Doors -->
                        <line x1="720" y1="230" x2="720" y2="250" stroke="#f43f5e" stroke-width="3"></line>
                        <line x1="740" y1="230" x2="740" y2="250" stroke="#f43f5e" stroke-width="3"></line>
                        <line x1="760" y1="230" x2="760" y2="250" stroke="#f43f5e" stroke-width="3"></line>

                        <!-- Bridge Deck & Sensor Array -->
                        <polygon points="360,285 420,280 440,325 420,370 360,365" fill="#0284c7" opacity="0.8" filter="url(#glow-cyan)" data-filter="url(#glow-cyan)"></polygon>
                        <line x1="420" y1="270" x2="420" y2="240" stroke="#e0f2fe" stroke-width="1.5"></line>
                        <circle cx="420" cy="240" r="3" fill="#38bdf8" filter="url(#glow-cyan)" data-filter="url(#glow-cyan)"></circle>

                        <!-- Front Spire Weapon Antenna -->
                        <line x1="1120" y1="325" x2="1170" y2="325" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow-cyan)" data-filter="url(#glow-cyan)"></line>
                    </g>
                </svg>