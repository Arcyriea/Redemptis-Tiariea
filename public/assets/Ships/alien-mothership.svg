<svg id="battleship-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" class="w-full h-full drop-shadow-2xl">
                    <defs>
                        <linearGradient id="lev-hull" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#064e3b"></stop>
                            <stop offset="50%" stop-color="#022c22"></stop>
                            <stop offset="100%" stop-color="#020617"></stop>
                        </linearGradient>
                        <linearGradient id="lev-glow" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#34d399"></stop>
                            <stop offset="50%" stop-color="#10b981"></stop>
                            <stop offset="100%" stop-color="#059669"></stop>
                        </linearGradient>
                        <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="6" result="blur"></feGaussianBlur>
                            <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
                        </filter>
                    </defs>

                    <!-- Bio Thruster Jets -->
                    <g class="layer-cores" style="display: block;">
                        <path d="M 120 250 C 40 240, 20 290, 0 300 C 20 310, 40 360, 120 350 Z" fill="url(#lev-glow)" filter="url(#emerald-glow)" opacity="0.8" data-filter-active="true"></path>
                    </g>

                    <!-- Organic Shell Layers -->
                    <g class="layer-base" stroke="#10b981" stroke-width="1.5" stroke-linejoin="round">
                        <!-- Crescent Outer Mandibles -->
                        <path d="M 150 300 C 220 120, 500 50, 880 180 C 700 220, 450 220, 300 300 C 450 380, 700 380, 880 420 C 500 550, 220 480, 150 300 Z" fill="url(#lev-hull)"></path>
                    </g>

                    <!-- Paneling & Segmented Ribs -->
                    <g class="layer-panels" fill="#065f46" stroke="#34d399" stroke-width="1" style="display: block;">
                        <!-- Organic Chitin Plates -->
                        <path d="M 320 280 C 420 200, 600 200, 750 260 C 620 250, 480 250, 320 280 Z"></path>
                        <path d="M 320 320 C 420 400, 600 400, 750 340 C 620 350, 480 350, 320 320 Z"></path>
                    </g>

                    <!-- Bio Core & Containment Rings -->
                    <g class="layer-cores" style="display: block;">
                        <!-- Glowing Center Node -->
                        <circle cx="380" cy="300" r="35" fill="url(#lev-glow)" filter="url(#emerald-glow)" data-filter-active="true"></circle>
                        
                        <!-- Anti-Matter Containment Ring Arc -->
                        <path d="M 800 210 A 120 120 0 0 1 800 390" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-dasharray="12 6" filter="url(#emerald-glow)" data-filter-active="true"></path>
                    </g>

                    <!-- Accents & Bio Filament Needles -->
                    <g class="layer-accents" stroke="#a7f3d0" stroke-width="1.5" style="display: block;">
                        <line x1="880" y1="180" x2="960" y2="150" filter="url(#emerald-glow)" data-filter-active="true"></line>
                        <line x1="880" y1="420" x2="960" y2="450" filter="url(#emerald-glow)" data-filter-active="true"></line>
                        <path d="M 380 300 L 850 300" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4" filter="url(#emerald-glow)" data-filter-active="true"></path>
                    </g>
                </svg>