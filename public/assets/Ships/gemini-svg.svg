<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1d33" />
      <stop offset="100%" stop-color="#050a14" />
    </radialGradient>

    <!-- Core & Plasma Glow Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-core" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="25" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for Metallic Hull Panels -->
    <linearGradient id="hullLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2ffff" />
      <stop offset="50%" stop-color="#b8f0e8" />
      <stop offset="100%" stop-color="#8fdad3" />
    </linearGradient>

    <linearGradient id="hullMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7bd3ce" />
      <stop offset="50%" stop-color="#4ab8c4" />
      <stop offset="100%" stop-color="#328a98" />
    </linearGradient>

    <linearGradient id="hullDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a6d7c" />
      <stop offset="100%" stop-color="#183e4a" />
    </linearGradient>

    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ab" />
      <stop offset="50%" stop-color="#cbb561" />
      <stop offset="100%" stop-color="#8d7a31" />
    </linearGradient>

    <!-- Thruster Glow Gradients -->
    <linearGradient id="engineExhaust" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#5bfbf1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Radial Gradients for Energy Core -->
    <radialGradient id="coreEnergy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#8efff5" />
      <stop offset="60%" stop-color="#26cca8" />
      <stop offset="90%" stop-color="#0d6d62" />
      <stop offset="100%" stop-color="#083832" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="600" fill="url(#spaceGlow)" />

  <!-- Blueprint Grid Overlay -->
  <g stroke="#1e3a5f" stroke-width="0.5" opacity="0.3">
    <path d="M 0,150 H 1200 M 0,300 H 1200 M 0,450 H 1200" />
    <path d="M 200,0 V 600 M 400,0 V 600 M 600,0 V 600 M 800,0 V 600 M 1000,0 V 600" />
    <!-- Center Axis Line -->
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#00ffff" stroke-width="1" stroke-dasharray="8,4" opacity="0.4" />
  </g>

  <!-- SHIP MASTER CONTAINER (Horizontal Alignment: Rear on Left, Front/Prongs on Right) -->
  <g id="tiareian-dreadnought">

    <!-- 1. ENGINE EXHAUST PLUMES -->
    <g filter="url(#glow-core)">
      <polygon points="170,252 60,230 170,238" fill="url(#engineExhaust)" />
      <polygon points="170,348 60,370 170,362" fill="url(#engineExhaust)" />
      <polygon points="170,248 10,240 170,235" fill="url(#engineExhaust)" />
      <polygon points="170,352 10,360 170,365" fill="url(#engineExhaust)" />
    </g>

    <!-- 2. REAR HULL & THRUSTER NOZZLES -->
    <g stroke="#132448" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <!-- Upper Thruster Assembly -->
      <path d="M 170,225 L 230,225 L 245,242 L 180,258 L 170,250 Z" fill="url(#hullDark)" />
      <rect x="155" y="228" width="20" height="24" rx="3" fill="url(#hullMid)" />
      <!-- Lower Thruster Assembly -->
      <path d="M 170,375 L 230,375 L 245,358 L 180,342 L 170,350 Z" fill="url(#hullDark)" />
      <rect x="155" y="348" width="20" height="24" rx="3" fill="url(#hullMid)" />

      <!-- Rear Center Spine & Power Cables -->
      <path d="M 180,285 C 220,280 250,260 280,260 L 280,340 C 250,340 220,320 180,315 Z" fill="#132a38" />
      <!-- Conduits / Cables -->
      <path d="M 180,270 Q 230,265 290,280" fill="none" stroke="#225363" stroke-width="4" />
      <path d="M 180,330 Q 230,335 290,320" fill="none" stroke="#225363" stroke-width="4" />
      <path d="M 175,280 Q 225,280 280,290" fill="none" stroke="#5bfbf1" stroke-width="2" filter="url(#glow-cyan)" />
      <path d="M 175,320 Q 225,320 280,310" fill="none" stroke="#5bfbf1" stroke-width="2" filter="url(#glow-cyan)" />

      <!-- Rear Pointed Tail Fin -->
      <path d="M 130,300 L 190,265 L 220,300 L 190,335 Z" fill="url(#hullLight)" />
      <path d="M 160,300 L 190,280 L 205,300 L 190,320 Z" fill="url(#hullMid)" />
    </g>

    <!-- 3. MAIN FACETED REAR SUPERSTRUCTURE -->
    <g stroke="#132448" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <!-- Outer Wing Flairs (Aft) -->
      <path d="M 280,230 L 370,160 L 430,210 L 360,265 Z" fill="url(#hullMid)" />
      <path d="M 280,370 L 370,440 L 430,390 L 360,335 Z" fill="url(#hullMid)" />

      <!-- Main Faceted Armor Block -->
      <path d="M 260,250 L 360,200 L 440,250 L 470,300 L 440,350 L 360,400 L 260,350 L 300,300 Z" fill="url(#hullLight)" />
      
      <!-- Inner Armor Insets (Top/Bottom Symmetry) -->
      <path d="M 330,240 L 400,215 L 420,255 L 360,270 Z" fill="url(#hullLight)" />
      <path d="M 330,360 L 400,385 L 420,345 L 360,330 Z" fill="url(#hullLight)" />

      <!-- Center Facet Diamond Gem -->
      <polygon points="410,300 435,275 460,300 435,325" fill="#a3f7ee" stroke="#132448" stroke-width="2.5" />
      <polygon points="418,300 435,283 452,300 435,317" fill="#ffffff" />

      <!-- Circular Hull Vent Triplets (Upper & Lower) -->
      <!-- Upper Triad -->
      <circle cx="345" cy="270" r="11" fill="url(#hullDark)" />
      <circle cx="370" cy="270" r="11" fill="url(#hullDark)" />
      <circle cx="395" cy="270" r="11" fill="url(#hullDark)" />
      <circle cx="345" cy="270" r="6" fill="#409fa0" />
      <circle cx="370" cy="270" r="6" fill="#409fa0" />
      <circle cx="395" cy="270" r="6" fill="#409fa0" />

      <!-- Lower Triad -->
      <circle cx="345" cy="330" r="11" fill="url(#hullDark)" />
      <circle cx="370" cy="330" r="11" fill="url(#hullDark)" />
      <circle cx="395" cy="330" r="11" fill="url(#hullDark)" />
      <circle cx="345" cy="330" r="6" fill="#409fa0" />
      <circle cx="370" cy="330" r="6" fill="#409fa0" />
      <circle cx="395" cy="330" r="6" fill="#409fa0" />
    </g>

    <!-- 4. SWEPT SIDE WINGS & SECONDARY TURRETS -->
    <g stroke="#132448" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <!-- Upper Swept Wing -->
      <path d="M 430,210 C 470,140 520,80 610,70 C 580,120 560,170 540,220 Z" fill="url(#hullLight)" />
      <path d="M 450,200 C 485,150 530,105 590,95 C 565,135 545,175 530,210 Z" fill="url(#hullMid)" />

      <!-- Lower Swept Wing -->
      <path d="M 430,390 C 470,460 520,520 610,530 C 580,480 560,430 540,380 Z" fill="url(#hullLight)" />
      <path d="M 450,400 C 485,450 530,495 590,505 C 565,465 545,425 530,390 Z" fill="url(#hullMid)" />

      <!-- Wing Energy Channel Lines -->
      <path d="M 470,180 Q 520,140 560,115" fill="none" stroke="#5bfbf1" stroke-width="3" filter="url(#glow-cyan)" />
      <path d="M 470,420 Q 520,460 560,485" fill="none" stroke="#5bfbf1" stroke-width="3" filter="url(#glow-cyan)" />

      <!-- Flanking Point-Defense / Ion Turrets -->
      <!-- Top Turret -->
      <g transform="translate(610, 85)">
        <circle cx="0" cy="0" r="14" fill="url(#hullDark)" />
        <rect x="-3" y="-18" width="6" height="16" rx="2" fill="#d0f7f3" />
        <rect x="-8" y="-16" width="4" height="14" rx="1" fill="#7bd3ce" />
        <rect x="4" y="-16" width="4" height="14" rx="1" fill="#7bd3ce" />
      </g>
      <!-- Bottom Turret -->
      <g transform="translate(610, 515)">
        <circle cx="0" cy="0" r="14" fill="url(#hullDark)" />
        <rect x="-3" y="2" width="6" height="16" rx="2" fill="#d0f7f3" />
        <rect x="-8" y="2" width="4" height="14" rx="1" fill="#7bd3ce" />
        <rect x="4" y="2" width="4" height="14" rx="1" fill="#7bd3ce" />
      </g>
    </g>

    <!-- 5. FORWARD FORK TINES / WEAPON BLADES -->
    <g stroke="#132448" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <!-- Upper Prong Main Body -->
      <path d="M 520,250 L 750,240 C 860,235 980,210 1120,180 C 990,240 850,265 730,265 L 530,265 Z" fill="url(#hullLight)" />
      <!-- Upper Prong Inner Panel -->
      <path d="M 600,250 L 780,244 C 880,225 970,205 1060,188 C 960,230 850,252 740,255 Z" fill="url(#hullMid)" />

      <!-- Lower Prong Main Body -->
      <path d="M 520,350 L 750,360 C 860,365 980,390 1120,420 C 990,360 850,335 730,335 L 530,335 Z" fill="url(#hullLight)" />
      <!-- Lower Prong Inner Panel -->
      <path d="M 600,350 L 780,356 C 880,375 970,395 1060,412 C 960,370 850,348 740,345 Z" fill="url(#hullMid)" />

      <!-- Inner Blade Emitter Rails (Glowing cyan inner edge) -->
      <path d="M 580,265 L 750,265 C 870,265 980,238 1110,183" fill="none" stroke="#5bfbf1" stroke-width="4" filter="url(#glow-cyan)" />
      <path d="M 580,335 L 750,335 C 870,335 980,362 1110,417" fill="none" stroke="#5bfbf1" stroke-width="4" filter="url(#glow-cyan)" />
    </g>

    <!-- 6. CENTRAL CIRCULAR HOUSING & PHOTON-ION CORE ASSEMBLY -->
    <g stroke="#132448" stroke-width="3">
      <!-- Outer Crescent Wings Housing Connection -->
      <path d="M 450,300 C 450,200 530,170 630,170 C 730,170 810,200 810,300 C 810,400 730,430 630,430 C 530,430 450,400 450,300 Z" fill="url(#hullMid)" />

      <!-- Gold Trim Accent Ring -->
      <circle cx="630" cy="300" r="118" fill="none" stroke="url(#goldTrim)" stroke-width="8" />

      <!-- Outer Light Hull Ring -->
      <circle cx="630" cy="300" r="110" fill="url(#hullLight)" />

      <!-- Segmented Panel Lines on Core Ring -->
      <g stroke="#132448" stroke-width="2" fill="none">
        <line x1="630" y1="190" x2="630" y2="410" />
        <line x1="520" y1="300" x2="740" y2="300" />
        <line x1="552" y1="222" x2="708" y2="378" />
        <line x1="552" y1="378" x2="708" y2="222" />
      </g>

      <!-- Inner Dark Mechanical Collar -->
      <circle cx="630" cy="300" r="82" fill="url(#hullDark)" />

      <!-- Golden Focusing Nodes / Spheres around Rim -->
      <circle cx="630" cy="222" r="7" fill="url(#goldTrim)" />
      <circle cx="630" cy="378" r="7" fill="url(#goldTrim)" />
      <circle cx="552" cy="300" r="7" fill="url(#goldTrim)" />
      <circle cx="708" cy="300" r="7" fill="url(#goldTrim)" />

      <!-- Aperture Ring with Concentric Teeth -->
      <circle cx="630" cy="300" r="68" fill="#0f2b35" stroke="#4ab8c4" stroke-width="4" />
      <circle cx="630" cy="300" r="58" fill="none" stroke="#236068" stroke-width="6" stroke-dasharray="12,6" />

      <!-- GLOWING PLASMA CORE -->
      <circle cx="630" cy="300" r="46" fill="url(#coreEnergy)" stroke="#ffffff" stroke-width="2" filter="url(#glow-core)" />
      <circle cx="630" cy="300" r="22" fill="#ffffff" filter="url(#glow-cyan)" />
    </g>

    <!-- 7. ENERGY ARCS / FIELD LINES AROUND CORE -->
    <g fill="none" stroke="#7efff5" stroke-width="1.5" opacity="0.75" filter="url(#glow-cyan)">
      <!-- Curved Energy Filaments -->
      <path d="M 500,240 Q 470,300 500,360" />
      <path d="M 760,240 Q 790,300 760,360" />
      <path d="M 520,220 C 500,180 540,150 580,170" />
      <path d="M 520,380 C 500,420 540,450 580,430" />
      <!-- Field Rings -->
      <ellipse cx="630" cy="300" rx="140" ry="125" stroke-dasharray="6,15,25,10" />
      <ellipse cx="630" cy="300" rx="155" ry="140" stroke-dasharray="4,20,10,12" />
    </g>

    <!-- 8. HEAVY CANNON HARDPOINTS (Top/Bottom Core Mounted) -->
    <g stroke="#132448" stroke-width="2.5" stroke-linejoin="round">
      <!-- Upper Heavy Turret -->
      <g transform="translate(630, 168)">
        <rect x="-16" y="-12" width="32" height="18" rx="4" fill="url(#hullDark)" />
        <rect x="-5" y="-30" width="10" height="22" rx="2" fill="url(#hullLight)" />
        <line x1="0" y1="-30" x2="0" y2="-8" stroke="#5bfbf1" stroke-width="3" filter="url(#glow-cyan)" />
      </g>
      <!-- Lower Heavy Turret -->
      <g transform="translate(630, 432)">
        <rect x="-16" y="-6" width="32" height="18" rx="4" fill="url(#hullDark)" />
        <rect x="-5" y="8" width="10" height="22" rx="2" fill="url(#hullLight)" />
        <line x1="0" y1="8" x2="0" y2="30" stroke="#5bfbf1" stroke-width="3" filter="url(#glow-cyan)" />
      </g>
    </g>
  </g>

  <!-- HUD TECHNICAL ANNOTATIONS & OVERLAY TEXT -->
  <g font-family="monospace, sans-serif" font-size="12" fill="#5bfbf1" opacity="0.85">
    <!-- Header Title -->
    <text x="40" y="50" font-size="22" font-weight="bold" letter-spacing="3" fill="#ffffff">TIAREIAN STARBLADE-CLASS DREADNOUGHT</text>
    <text x="40" y="72" font-size="13" letter-spacing="2" fill="#4ab8c4">TOP-DOWN PLAN VIEW // VECTOR SCHEMATIC</text>

    <!-- Callouts & Pointer Lines -->
    <!-- Callout 1: Forward Weapon Tines -->
    <path d="M 980,175 L 1020,110 H 1120" fill="none" stroke="#5bfbf1" stroke-width="1.5" stroke-dasharray="4,2" />
    <circle cx="980" cy="175" r="3" fill="#5bfbf1" />
    <text x="1025" y="98" font-weight="bold">FORWARD ENERGY TINES</text>
    <text x="1025" y="118" font-size="10" fill="#a3f7ee">PHOTON-ION EMITTER ARRAYS</text>

    <!-- Callout 2: Main Photon Ion Core -->
    <path d="M 630,222 L 680,100 H 800" fill="none" stroke="#5bfbf1" stroke-width="1.5" stroke-dasharray="4,2" />
    <circle cx="630" cy="222" r="3" fill="#5bfbf1" />
    <text x="685" y="88" font-weight="bold">PRIMARY CORE REACTOR</text>
    <text x="685" y="108" font-size="10" fill="#a3f7ee">AOE HEAVY ION BEAM CANNON</text>

    <!-- Callout 3: Rear Linear Accelerator -->
    <path d="M 370,270 L 320,130 H 200" fill="none" stroke="#5bfbf1" stroke-width="1.5" stroke-dasharray="4,2" />
    <circle cx="370" cy="270" r="3" fill="#5bfbf1" />
    <text x="200" y="118" font-weight="bold">LINEAR ACCELERATOR BATTERY</text>

    <!-- Callout 4: Thruster System -->
    <path d="M 170,375 L 120,490 H 40" fill="none" stroke="#5bfbf1" stroke-width="1.5" stroke-dasharray="4,2" />
    <circle cx="170" cy="375" r="3" fill="#5bfbf1" />
    <text x="40" y="480" font-weight="bold">SUBLIGHT DRIVE NOZZLES</text>

    <!-- Scale Legend -->
    <g transform="translate(980, 520)">
      <rect x="0" y="0" width="160" height="40" fill="#0c1d33" stroke="#1e3a5f" stroke-width="1" />
      <line x1="15" y1="20" x2="145" y2="20" stroke="#5bfbf1" stroke-width="2" />
      <line x1="15" y1="12" x2="15" y2="28" stroke="#5bfbf1" stroke-width="2" />
      <line x1="80" y1="15" x2="80" y2="25" stroke="#5bfbf1" stroke-width="1" />
      <line x1="145" y1="12" x2="145" y2="28" stroke="#5bfbf1" stroke-width="2" />
      <text x="80" y="34" font-size="10" text-anchor="middle" fill="#a3f7ee">500 METERS</text>
    </g>
  </g>
</svg>