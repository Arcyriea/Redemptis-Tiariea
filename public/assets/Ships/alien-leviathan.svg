<svg id="battleship-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" class="w-full h-full">
                    <defs>
                        <linearGradient id="ali-chitin1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#064e3b"></stop>
                            <stop offset="50%" stop-color="#022c22"></stop>
                            <stop offset="100%" stop-color="#011710"></stop>
                        </linearGradient>
                        <linearGradient id="ali-chitin2" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#0f766e"></stop>
                            <stop offset="100%" stop-color="#064e3b"></stop>
                        </linearGradient>
                        <linearGradient id="ali-crystal" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#34d399"></stop>
                            <stop offset="50%" stop-color="#10b981"></stop>
                            <stop offset="100%" stop-color="#059669"></stop>
                        </linearGradient>
                        <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="7" result="blur"></feGaussianBlur>
                            <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
                        </filter>
                    </defs>

                    <!-- Bio Thruster Glow -->
                    <g class="layer-cores" style="display: block;">
                        <path d="M 180 250 C 40 200, 20 320, -20 325 C 20 330, 40 450, 180 400 Z" fill="url(#ali-crystal)" filter="url(#glow-emerald)" opacity="0.8" data-filter="url(#glow-emerald)"></path>
                    </g>

                    <!-- Asymmetrical Organic Frame tendrils -->
                    <g class="layer-gantries" stroke="#10b981" stroke-width="1.2" fill="none" style="display: block;">
                        <path d="M 280 200 Q 550 100 850 140 T 1100 280" stroke-dasharray="6 3"></path>
                        <path d="M 280 450 Q 550 550 850 510 T 1100 370" stroke-dasharray="6 3"></path>
                    </g>

                    <!-- Bio-Chitin Outer Carapace -->
                    <g class="layer-base" stroke="#047857" stroke-width="2" stroke-linejoin="round">
                        <!-- Upper Curved Mandible -->
                        <path d="M 180 280 C 250 150, 520 80, 880 160 C 1020 200, 1140 280, 1180 310 C 1000 310, 750 260, 520 280 C 350 290, 240 300, 180 280 Z" fill="url(#ali-chitin1)"></path>
                        <!-- Lower Curved Mandible -->
                        <path d="M 180 370 C 250 500, 520 570, 880 490 C 1020 450, 1140 370, 1180 340 C 1000 340, 750 390, 520 370 C 350 360, 240 350, 180 370 Z" fill="url(#ali-chitin1)"></path>
                    </g>

                    <!-- Segmented Shell Paneling -->
                    <g class="layer-panels" fill="url(#ali-chitin2)" stroke="#34d399" stroke-width="1" style="display: block;">
                        <path d="M 380 240 Q 520 180 680 210 Q 580 260 380 240 Z"></path>
                        <path d="M 380 410 Q 520 470 680 440 Q 580 390 380 410 Z"></path>
                        <!-- Central Spine Plates -->
                        <polygon points="480,290 620,270 740,310 600,325" fill="#065f46"></polygon>
                        <polygon points="480,360 620,380 740,340 600,325" fill="#065f46"></polygon>
                    </g>

                    <!-- Resonance Energy Cores -->
                    <g class="layer-cores" style="display: block;">
                        <!-- Central Luminous Heart Node -->
                        <ellipse cx="450" cy="325" rx="45" ry="25" fill="url(#ali-crystal)" filter="url(#glow-emerald)" data-filter="url(#glow-emerald)"></ellipse>
                        <ellipse cx="750" cy="325" rx="30" ry="15" fill="url(#ali-crystal)" filter="url(#glow-emerald)" data-filter="url(#glow-emerald)"></ellipse>

                        <!-- Organic Fluid Conduits -->
                        <path d="M 450 325 Q 600 280 750 325" fill="none" stroke="#a7f3d0" stroke-width="3" filter="url(#glow-emerald)" data-filter="url(#glow-emerald)"></path>
                        <path d="M 450 325 Q 600 370 750 325" fill="none" stroke="#a7f3d0" stroke-width="3" filter="url(#glow-emerald)" data-filter="url(#glow-emerald)"></path>
                    </g>

                    <!-- Crystalline Emitters & Filaments -->
                    <g class="layer-accents" stroke="#6ee7b7" stroke-width="1.5" style="display: block;">
                        <line x1="1180" y1="310" x2="1220" y2="290" filter="url(#glow-emerald)" stroke-width="2.5" data-filter="url(#glow-emerald)"></line>
                        <line x1="1180" y1="340" x2="1220" y2="360" filter="url(#glow-emerald)" stroke-width="2.5" data-filter="url(#glow-emerald)"></line>

                        <!-- Plasma Beam Cavitation Point -->
                        <circle cx="1180" cy="325" r="8" fill="#a7f3d0" filter="url(#glow-emerald)" data-filter="url(#glow-emerald)"></circle>
                    </g>
                </svg>