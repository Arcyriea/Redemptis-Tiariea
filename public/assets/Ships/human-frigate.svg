<svg id="battleship-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" class="w-full h-full">
                    <defs>
                        <linearGradient id="frig-hull" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#334155"></stop>
                            <stop offset="50%" stop-color="#1e293b"></stop>
                            <stop offset="100%" stop-color="#0f172a"></stop>
                        </linearGradient>
                        <linearGradient id="frig-accent" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#0284c7"></stop>
                            <stop offset="100%" stop-color="#0369a1"></stop>
                        </linearGradient>
                        <linearGradient id="frig-thrust" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#38bdf8"></stop>
                            <stop offset="100%" stop-color="#0284c7" stop-opacity="0"></stop>
                        </linearGradient>
                        <filter id="glow-sky" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur>
                            <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
                        </filter>
                    </defs>

                    <!-- Engine Plumes -->
                    <g class="layer-cores" style="display: block;">
                        <polygon points="180,260 20,240 180,285" fill="url(#frig-thrust)" filter="url(#glow-sky)" data-filter="url(#glow-sky)"></polygon>
                        <polygon points="180,365 20,410 180,390" fill="url(#frig-thrust)" filter="url(#glow-sky)" data-filter="url(#glow-sky)"></polygon>
                    </g>

                    <!-- Structural Frame -->
                    <g class="layer-gantries" stroke="#475569" stroke-width="1.5" fill="none" style="display: block;">
                        <line x1="200" y1="325" x2="1050" y2="325" stroke="#38bdf8" stroke-dasharray="4 4"></line>
                        <!-- External Rigging Gantries -->
                        <path d="M 320 250 L 520 220 L 720 250"></path>
                        <path d="M 320 400 L 520 430 L 720 400"></path>
                    </g>

                    <!-- Primary Hull Geometry -->
                    <g class="layer-base" stroke="#0f172a" stroke-width="2">
                        <!-- Main Fuselage -->
                        <path d="M 180 250 L 380 200 L 750 210 L 1050 320 L 1050 330 L 750 440 L 380 450 L 180 400 Z" fill="url(#frig-hull)"></path>
                        <!-- Wing Cantilevers -->
                        <polygon points="260,250 160,150 360,180 480,240" fill="url(#frig-accent)"></polygon>
                        <polygon points="260,400 160,500 360,470 480,410" fill="url(#frig-accent)"></polygon>
                    </g>

                    <!-- Armor Paneling -->
                    <g class="layer-panels" stroke="#0284c7" stroke-width="1" fill="#1e293b" style="display: block;">
                        <path d="M 450 260 L 680 250 L 740 310 L 480 310 Z"></path>
                        <path d="M 450 390 L 680 400 L 740 340 L 480 340 Z"></path>
                    </g>

                    <!-- Thruster Engines -->
                    <g class="layer-cores" style="display: block;">
                        <rect x="170" y="250" width="30" height="40" rx="4" fill="#0f172a" stroke="#38bdf8"></rect>
                        <rect x="170" y="360" width="30" height="40" rx="4" fill="#0f172a" stroke="#38bdf8"></rect>
                        <circle cx="580" cy="325" r="16" fill="#38bdf8" filter="url(#glow-sky)" data-filter="url(#glow-sky)"></circle>
                    </g>

                    <!-- Weapon & Sensor Suite -->
                    <g class="layer-accents" stroke="#7dd3fc" stroke-width="1.5" style="display: block;">
                        <!-- Forward Gauss Cannon Barrel -->
                        <line x1="1050" y1="325" x2="1140" y2="325" stroke="#7dd3fc" stroke-width="4" filter="url(#glow-sky)" data-filter="url(#glow-sky)"></line>
                        <!-- Sensor Mast -->
                        <line x1="620" y1="210" x2="620" y2="140" stroke="#7dd3fc" stroke-width="2"></line>
                        <polygon points="610,140 630,140 620,120" fill="#7dd3fc" filter="url(#glow-sky)" data-filter="url(#glow-sky)"></polygon>
                    </g>
                </svg>